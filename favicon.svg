<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#1A1A1A"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="2,4"/>
  
  <!-- Stylized G that morphs into a code slash -->
  <path d="M70 30 
           A 30 30 0 1 0 70 70 
           L 70 50 
           L 50 50 
           M 40 80 L 65 20" 
        fill="none" 
        stroke="#D4AF37" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Small 'Terminal' Dot -->
  <circle cx="75" cy="75" r="4" fill="#00FF41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </circle>
</svg>
